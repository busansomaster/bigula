<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA - My Dashboard</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial,sans-serif; }

body { background:#0f0f0f; color:#fff; }

header {
  background:#1a1a1a;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1 { color:#ff0050; font-size:1.6rem; }

header button {
  background:#ff0050;
  border:none;
  padding:8px 18px;
  border-radius:20px;
  color:#fff;
  cursor:pointer;
}

.container {
  display:flex;
  width:95%;
  margin:20px auto;
  gap:20px;
  min-height:75vh;
}

.sidebar {
  width:180px; /* smaller */
  background:#161616;
  padding:15px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.sidebar .menu button {
  width:100%;
  padding:8px;
  margin-bottom:8px;
  font-size:13px;
  border:none;
  border-radius:8px;
  background:#ff0050;
  color:#fff;
  cursor:pointer;
}

.sidebar .menu button:hover {
  background:#e60045;
}

.footer-nav button {
  width:100%;
  padding:8px;
  margin-top:8px;
  font-size:13px;
  border:none;
  border-radius:8px;
  background:#333;
  color:#fff;
  cursor:pointer;
}

.main-content {
  flex:1; /* takes most space */
  background:#141414;
  padding:25px;
  border-radius:12px;
  overflow-y:auto;
}

.main-content h2 {
  color:#ff0050;
  margin-bottom:20px;
}

.video-item {
  background:#1c1c1c;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
}

.video-item p {
  font-size:14px;
  margin-bottom:5px;
}

.progress-bar {
  width:100%;
  background:#333;
  height:8px;
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
}

.progress-fill {
  height:8px;
  background:#ff0050;
}

.monetize-btn {
  margin-top:15px;
  padding:10px 15px;
  background:#00c853;
  border:none;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
  <h1>BIGULA Dashboard</h1>
  <button onclick="alert('Sign out coming soon')">Sign Out</button>
</header>

<div class="container">

  <div class="sidebar">
    <div class="menu">
      <button onclick="showMyVideos()">My Videos</button>
      <button onclick="showMonetize()">Monetize</button>
      <button onclick="uploadVideo()">Upload +</button>
      <button onclick="showFollowing()">Following</button>
      <button onclick="showFollowers()">Followers</button>
    </div>

    <div class="footer-nav">
      <button onclick="location.href='account.html'">My Account</button>
      <button onclick="location.href='home.html'">Home</button>
      <button onclick="location.href='inbox.html'">Inbox</button>
    </div>
  </div>

  <div class="main-content" id="mainContent">
    <h2>Welcome to your dashboard</h2>
    <p>Select an option from the menu.</p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const main = document.getElementById("mainContent");

function uploadVideo() {
  location.href = "upload.html";
}

window.showMyVideos = function() {
  main.innerHTML = "<h2>My Videos</h2>";

  const user = auth.currentUser;
  if (!user) {
    main.innerHTML += "<p>Please login.</p>";
    return;
  }

  const q = query(
    collection(db, "videos"),
    where("creatorId", "==", user.uid)
  );

  onSnapshot(q, (snapshot) => {
    main.innerHTML = "<h2>My Videos</h2>";

    snapshot.forEach(doc => {
      const video = doc.data();

      const div = document.createElement("div");
      div.className = "video-item";

      if(video.status === "uploading") {
        div.innerHTML = `
          <p><strong>${video.title}</strong></p>
          <p>Status: Uploading (${video.progress || 0}%)</p>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${video.progress || 0}%"></div>
          </div>
        `;
      } else {
        div.innerHTML = `
          <p><strong>${video.title}</strong></p>
          <p>Status: Published</p>
          <p>👁 ${video.views} | ❤️ ${video.likesCount} | 💬 ${video.commentsCount}</p>
        `;
      }

      main.appendChild(div);
    });
  });
};

window.showMonetize = function() {
  main.innerHTML = "<h2>Monetization</h2>";

  const monetized = false; // Keep existing logic untouched

  if(monetized) {
    main.innerHTML += "<p>Your earnings: $0.00</p>";
  } else {
    main.innerHTML += `
      <p>To begin monetizing:</p>
      <ul>
        <li>Upload at least 3 videos</li>
        <li>Get 1,000 views total</li>
        <li>Follow community guidelines</li>
      </ul>
      <button class="monetize-btn" onclick="location.href='monetize.html'">
        Begin Monetize
      </button>
    `;
  }
};

window.showFollowing = function() {
  main.innerHTML = "<h2>Following</h2><p>Following list coming soon...</p>";
};

window.showFollowers = function() {
  main.innerHTML = "<h2>Followers</h2><p>Followers list coming soon...</p>";
};
</script>

</body>
</html>
