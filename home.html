<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial; }
body { background:#000; color:#fff; overflow-x:hidden; }

.top-nav {
  position:fixed; top:0; width:100%; background:#000;
  padding:14px 10px; display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid #222; z-index:1000;
  flex-wrap:wrap;
}

.filter-scroll {
  display:flex; overflow-x:auto; gap:8px; margin:5px 0;
}

.filter-btn {
  flex:0 0 auto; background:none; border:none; color:#aaa;
  font-weight:bold; cursor:pointer; padding:8px 16px; border-radius:20px; font-size:16px;
  white-space:nowrap;
}
.filter-btn.active { color:#ff0050; border:2px solid #ff0050; }

#loginBtn, #addVideoBtn {
  padding:8px 18px; border-radius:20px; font-weight:bold; font-size:16px; border:none; cursor:pointer; margin-left:5px;
}
#loginBtn { background:#ff0050; color:#fff; }
#addVideoBtn { background:#555; color:#ccc; cursor:not-allowed; }
#addVideoBtn.enabled { background:#ff0050; color:#fff; cursor:pointer; }

.search-bar {
  position:fixed; top:70px; width:100%; padding:10px; background:#111; display:none;
}
.search-bar input { width:100%; padding:10px; border-radius:25px; border:none; font-size:16px; }

.feed {
  margin-top:110px; margin-bottom:60px; padding:0; display:flex; flex-direction:column;
  scroll-snap-type: y mandatory; overflow-y:auto; height:calc(100vh - 110px);
}

.video-card { margin-bottom:0; position:relative; scroll-snap-align:start; height:100vh; display:flex; flex-direction:column; justify-content:center; }
video { width:100%; height:100%; object-fit:cover; border-radius:0; display:block; }

.video-info {
  position:absolute; bottom:80px; left:10px; color:#fff; z-index:10; width:95%;
  background: rgba(0,0,0,0.3); padding:8px; border-radius:10px;
}
.video-info h3 { font-size:20px; margin-bottom:4px; }
.video-info p { font-size:14px; color:#ccc; margin:2px 0; }
.actions { display:flex; gap:15px; margin-top:4px; }
.actions button { background:none; border:none; color:#fff; cursor:pointer; font-size:18px; }
.actions button.disabled { opacity:0.4; cursor:not-allowed; }

.footer {
  position:fixed; bottom:0; width:100%; background:#000;
  border-top:1px solid #222; display:flex; justify-content:space-around; padding:10px 0;
}
.footer button { font-size:24px; padding:10px; border:none; background:none; color:#fff; cursor:pointer; }
.footer button.disabled { opacity:0.4; cursor:not-allowed; }

.message { font-size:14px; color:#ff9999; text-align:center; display:none; }
</style>
</head>
<body>

<div class="top-nav">
  <button id="searchBtn">🔍</button>
  <div class="filter-scroll">
    <button class="filter-btn active" id="forYouBtn">For You</button>
    <button class="filter-btn" id="latestBtn">Latest</button>
    <button class="filter-btn" id="viralBtn">Viral</button>
  </div>
  <div>
    <button id="addVideoBtn">➕ Upload</button>
    <button id="loginBtn">Login</button>
  </div>
</div>

<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="Search users or titles...">
</div>


  <div id="feed"></div>

  <script type="module" src="home.js"></script>
<div class="footer">
  <button id="notifBtn">🔔</button>
  <button onclick="location.href='home.html'">🏠</button>
  <button id="accountBtn" class="disabled">👤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { baseVideos } from './data.js';

const firebaseConfig = {
  apiKey: "AIzaSyB8wGlVLw7ECGTQns65Ff8UyTT_on8OivY",
  authDomain: "bigula-d8cab.firebaseapp.com",
  projectId: "bigula-d8cab"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let currentUser = null;
const loginBtn = document.getElementById("loginBtn");
const addVideoBtn = document.getElementById("addVideoBtn");
const notifBtn = document.getElementById("notifBtn");
const accountBtn = document.getElementById("accountBtn");
const feed = document.getElementById("feed");

// --- Login / Button States ---
onAuthStateChanged(auth, user => {
  currentUser = user;
  if(currentUser){
    loginBtn.textContent="Dashboard"; loginBtn.onclick=()=> location.href='dashboard.html';
    addVideoBtn.classList.add("enabled"); addVideoBtn.onclick=()=> location.href='upload.html';
    accountBtn.classList.remove("disabled"); accountBtn.onclick=()=> location.href='account.html';
  } else {
    loginBtn.textContent="Login"; loginBtn.onclick=()=> location.href='login.html';
    addVideoBtn.classList.remove("enabled"); addVideoBtn.onclick=()=>{};
    accountBtn.classList.add("disabled"); accountBtn.onclick=()=>{};
  }
});

// --- Feed ---
let currentVideos = [...baseVideos];
let activeVideo = null;

function renderVideos(videoList){
  feed.innerHTML="";
  videoList.forEach((video,i)=>{
    const card = document.createElement("div"); card.className="video-card";
    card.innerHTML=`
      <video src="${video.videoUrl}" data-id="${video.id}" muted playsinline></video>
      <div class="video-info">
        <h3>${video.title}</h3>
        <p>@${video.creator}</p>
        <p>${new Date(video.createdAt).toLocaleString()}</p>
      </div>`;
    feed.appendChild(card);
  });
  setupAutoplay();
}

// Autoplay only the video currently in view
function setupAutoplay(){
  const videos = document.querySelectorAll("video");
  function playVisibleVideo(){
    let found=false;
    videos.forEach(v=>{
      const rect=v.getBoundingClientRect();
      if(rect.top>=0 && rect.bottom <= window.innerHeight){ 
        if(activeVideo && activeVideo!==v){ activeVideo.pause(); }
        activeVideo=v; v.play(); found=true;
      } else { v.pause(); }
    });
  }
  playVisibleVideo();
  feed.addEventListener("scroll", playVisibleVideo);
}

// Filters
document.getElementById("forYouBtn").onclick=()=>{ document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active")); forYouBtn.classList.add("active"); renderVideos(currentVideos.sort(()=>0.5-Math.random())); };
document.getElementById("latestBtn").onclick=()=>{ document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active")); latestBtn.classList.add("active"); renderVideos(currentVideos.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt))); };
document.getElementById("viralBtn").onclick=()=>{ document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active")); viralBtn.classList.add("active"); renderVideos(currentVideos.sort((a,b)=> b.views - a.views)); };

// Search
const searchBar = document.getElementById("searchBar");
document.getElementById("searchBtn").onclick=()=>{ searchBar.style.display = searchBar.style.display==='block'?'none':'block'; };
document.getElementById("searchInput").addEventListener("input", e=>{
  const q=e.target.value.toLowerCase();
  renderVideos(baseVideos.filter(v=>v.title.toLowerCase().includes(q) || v.creator.toLowerCase().includes(q)));
});

// Notifications button redirects
notifBtn.onclick=()=>{ location.href='notifications.html'; };

// Initial render
renderVideos(currentVideos);
</script>
</body>
</html>
