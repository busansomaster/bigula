<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA – Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#000;color:#fff;overflow:hidden;}
.topbar{position:fixed;top:0;width:100%;height:100px;background:linear-gradient(to bottom,#000 80%,transparent);z-index:20;padding:0 15px;display:flex;flex-direction:column;}
.logo{font-size:32px;font-weight:900;letter-spacing:4px;color:#ff0000;text-shadow:0 0 20px rgba(255,0,0,.8);line-height:40px;}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-top:5px;}
.tabs{display:flex;gap:25px;margin-top:10px;}
.tab{cursor:pointer;font-weight:700;opacity:.6;transition:.3s;font-size:18px;}
.tab.active{opacity:1;color:#ff0000;border-bottom:3px solid #ff0000;padding-bottom:4px;}
.actions{display:flex;gap:12px;align-items:center;}
.btn{padding:10px 22px;border-radius:40px;border:none;font-weight:800;cursor:pointer;transition:.3s;font-size:16px;}
.login-btn{background:#fff;color:#000;}
.upload-btn{background:#ff0000;color:#fff;}
.upload-btn.disabled{opacity:.4;cursor:not-allowed;}
.search{font-size:26px;cursor:pointer;color:#ff0000;margin-left:10px;}
.search-bar{position:fixed;top:100px;width:100%;background:#111;padding:10px 15px;display:none;z-index:19;border-bottom:1px solid #222;}
.search-bar input{width:100%;padding:12px;border-radius:40px;border:1px solid #333;background:#000;color:#fff;font-size:16px;}
.feed{position:absolute;top:150px;bottom:70px;width:100%;overflow-y:scroll;scroll-snap-type:y mandatory;display:flex;flex-direction:column;align-items:center;}
.video-card{height:auto;width:90%;max-width:600px;margin:20px auto;position:relative;scroll-snap-align:start;border:2px solid #ff1a1a;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#111;}
video{width:100%;height:auto;max-height:60vh;object-fit:cover;border-radius:12px;}
.info{width:95%;padding:10px;color:#fff;text-align:left;}
.username{font-weight:900;font-size:20px;cursor:pointer;color:#ff4d4f;}
.username:hover{text-decoration:underline;}
.follow-btn{background:#ff1a1a;color:#fff;padding:6px 12px;margin-left:10px;border-radius:15px;font-size:14px;cursor:pointer;}
.createdAt{color:#aaa;font-size:12px;margin-left:5px;}
.title{font-size:18px;margin-top:5px;font-weight:700;}
.stats{display:flex;justify-content:flex-start;gap:20px;margin-top:10px;}
.stat-btn{background:rgba(0,0,0,.7);padding:10px 15px;border-radius:25px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;font-size:16px;}
.stat-btn span{color:#fff;}
.comment-modal{position:fixed;bottom:0;width:100%;height:60%;background:#111;display:none;flex-direction:column;border-top:3px solid #ff0000;z-index:50;}
.comment-list{flex:1;overflow-y:auto;padding:15px;}
.comment-input{display:flex;border-top:1px solid #333;}
.comment-input input{flex:1;padding:12px;background:#000;border:none;color:#fff;font-size:16px;}
.comment-input button{background:#ff0000;border:none;padding:12px 20px;color:#fff;font-weight:bold;cursor:pointer;font-size:16px;}
.footer{position:fixed;bottom:0;width:100%;height:70px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;font-size:24px;}
.footer div{cursor:pointer;transition:.3s;}
.footer div.disabled{opacity:.4;pointer-events:none;}
.footer div:hover:not(.disabled){color:#ff0000;}
</style>
</head>
<body>

<div class="topbar">
  <div class="top-row">
    <div class="logo">BIGULA</div>
    <div class="actions">
      <div class="search">🔍</div>
      <button class="btn login-btn">Login</button>
      <button class="btn upload-btn disabled">Upload</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-feed="foryou">For You</div>
    <div class="tab" data-feed="latest">Latest</div>
    <div class="tab" data-feed="viral">Viral</div>
  </div>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search videos or creators...">
</div>

<div class="feed" id="feed"></div>

<div class="comment-modal" id="commentModal">
  <div class="comment-list" id="commentList"></div>
  <div class="comment-input">
    <input type="text" id="commentText" placeholder="Write a comment...">
    <button id="postCommentBtn">Post</button>
  </div>
</div>

<div class="footer">
  <div onclick="location.href='home.html'">🏠</div>
  <div id="notifBtn" class="disabled">🔔</div>
  <div id="accountBtn">👤</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const SUPABASE_URL = "https://uyuofjiiptnbbcuntbfi.supabase.co"
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dW9mamlpcHRuYmJjdW50YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMzQ3MjcsImV4cCI6MjA4NzkxMDcyN30.-FBKM7NKTSm20qzkExueYhqrE6oaK6a6de1qCsl2nuQ"
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

let currentUser = null;
let currentVideoId = null;

async function initUser(){
  const { data: { user } } = await supabase.auth.getUser()
  currentUser = user
  const loginBtn = document.querySelector(".login-btn")
  const uploadBtn = document.querySelector(".upload-btn")
  const accountBtn = document.getElementById("accountBtn")
  const notifBtn = document.getElementById("notifBtn")

  if(user){
    loginBtn.textContent="Dashboard"
    loginBtn.onclick=()=>location.href="dashboard.html"
    uploadBtn.classList.remove("disabled")
    uploadBtn.onclick=()=>location.href="upload.html"
    accountBtn.onclick=()=>location.href="account.html"
    notifBtn.classList.remove("disabled")
  }else{
    loginBtn.onclick=()=>location.href="signup.html"
    accountBtn.classList.add("disabled")
    notifBtn.classList.add("disabled")
  }
}
initUser()

async function fetchVideos(type="foryou"){
  let query = supabase.from("videos").select("*")
  if(type==="latest") query = query.order("created_at",{ascending:false})
  if(type==="viral") query = query.order("views",{ascending:false})
  const { data, error } = await query
  if(error){ console.error(error); return }
  renderVideos(data)
}

async function getCounts(videoId){
  const { count: likes } = await supabase.from("likes").select("*",{head:true}).eq("video_id",videoId)
  const { count: comments } = await supabase.from("comments").select("*",{head:true}).eq("video_id",videoId)
  return { likes, comments }
}

function renderVideos(videos){
  const feed = document.getElementById("feed")
  feed.innerHTML=""
  videos.forEach(async video=>{
    const counts = await getCounts(video.id)
    const card = document.createElement("div")
    card.className="video-card"
    card.innerHTML=`
      <video src="${video.video_url}" muted autoplay loop playsinline></video>
      <div class="info">
        <div>
          <span class="username" onclick="openProfile('${video.creator_id}')">@${video.username||'user'}</span>
          <button class="follow-btn" onclick="followUser('${video.creator_id}')">+</button>
          <span class="createdAt">${new Date(video.created_at).toLocaleString()}</span>
        </div>
        <div class="title">${video.title||''}</div>
        <div class="stats">
          <div class="stat-btn" onclick="likeVideo('${video.id}')">❤️ <span id="like-${video.id}">${counts.likes||0}</span></div>
          <div class="stat-btn" onclick="openComments('${video.id}')">💬 <span id="commentCount-${video.id}">${counts.comments||0}</span></div>
        </div>
      </div>
    `
    feed.appendChild(card)
  })
  setupAutoplay()
}

function setupAutoplay(){
  const vids=document.querySelectorAll("video")
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(e=> e.isIntersecting ? e.target.play() : e.target.pause())
  },{threshold:0.75})
  vids.forEach(v=>observer.observe(v))
}

function openProfile(uid){ location.href=`account.html?uid=${uid}` }

async function likeVideo(videoId){
  if(!currentUser) return location.href='signup.html'
  await supabase.from('likes').upsert({ video_id: videoId, user_id: currentUser.id }, { onConflict: ['video_id','user_id'] })
  const likeEl = document.getElementById(`like-${videoId}`)
  if(likeEl) likeEl.innerText = parseInt(likeEl.innerText||0)+1
}

async function openComments(videoId){
  if(!currentUser) return location.href='signup.html'
  currentVideoId = videoId
  const modal = document.getElementById("commentModal")
  const list = document.getElementById("commentList")
  list.innerHTML=""
  modal.style.display="flex"
  const { data: comments } = await supabase.from("comments").select("*").eq("video_id",videoId).order("created_at",{ascending:true})
  if(comments) comments.forEach(c=>{
    const div = document.createElement("div")
    div.innerHTML=`<strong>${c.username}</strong>: ${c.text}`
    list.appendChild(div)
  })
}

document.getElementById("postCommentBtn").onclick = async ()=>{
  if(!currentUser || !currentVideoId) return location.href='signup.html'
  const text = document.getElementById("commentText").value
  if(!text) return
  await supabase.from("comments").insert({ video_id: currentVideoId, user_id: currentUser.id, username: currentUser.email.split("@")[0], text })
  document.getElementById("commentText").value=''
  openComments(currentVideoId)
}

async function followUser(uid){
  if(!currentUser) return location.href='signup.html'
  await supabase.from('followers').upsert({ follower_id: currentUser.id, following_id: uid }, { onConflict:['follower_id','following_id'] })
  alert('Following!')
}

// Tabs
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))
    tab.classList.add("active")
    fetchVideos(tab.dataset.feed)
  }
})

// Search
document.querySelector(".search").onclick=()=>{ document.querySelector(".search-bar").style.display="block" }
document.getElementById("searchInput").addEventListener("input",e=>{
  const term=e.target.value.toLowerCase()
  document.querySelectorAll(".video-card").forEach(card=>{
    card.style.display = card.innerText.toLowerCase().includes(term) ? "flex" : "none"
  })
})

fetchVideos()
</script>
</body>
</html>
