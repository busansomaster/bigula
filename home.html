<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA - Home</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial,sans-serif; }
body { background:#121212; color:#fff; }
header { background:#1f1f1f; padding:12px 15px; display:flex; justify-content:space-between; align-items:center; }
header h1 { color:#ff4d4f; font-size:1.7rem; font-weight:bold; }
nav button {
  margin-left:8px;
  padding:8px 15px;
  border-radius:25px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  font-size:0.95rem;
  transition: transform 0.2s;
}
nav button:hover { transform: scale(1.05); }

/* Button colors */
.login-btn { background:#ff4d4f; color:#fff; }
.dashboard-btn { background:#4CAF50; color:#fff; }
.foru-btn { background:#ff9900; color:#fff; }
.upload-btn { background:#00bfff; color:#fff; }

main {
  max-width:600px;
  margin:20px auto;
  padding:0 10px;
  max-height:80vh;
  overflow-y:scroll;
}

.video-card {
  background:#1a1a1a;
  margin-bottom:20px;
  border-radius:15px;
  overflow:hidden;
  padding:10px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.video-card:hover { transform: scale(1.02); box-shadow:0 0 15px #ff4d4f; }
.video-card video { width:100%; border-radius:12px; }

.video-info {
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.video-info h3 { font-size:1rem; color:#fff; }

.video-actions button {
  background:none;
  border:none;
  color:#fff;
  cursor:pointer;
  margin-left:10px;
  font-size:1.2rem;
  transition: transform 0.2s;
}
.video-actions button:hover { transform: scale(1.2); }

footer { text-align:center; padding:15px; background:#1f1f1f; margin-top:20px; font-size:0.9rem; color:#ccc; }
</style>
</head>
<body>

<header>
  <h1>BIGULA</h1>
  <nav>
    <button id="loginBtn" class="login-btn" onclick="location.href='login.html'">Login</button>
    <button id="dashboardBtn" class="dashboard-btn" style="display:none;" onclick="location.href='dashboard.html'">My Dashboard</button>
    <button class="foru-btn" onclick="alert('For You feed coming soon!')">For You</button>
    <button class="upload-btn" id="uploadBtn">Upload</button>
  </nav>
</header>

<main>
  <!-- Video Card 1 -->
  <div class="video-card">
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls></video>
    <div class="video-info">
      <h3>Awesome Video #1</h3>
      <div class="video-actions">
        <button>👍 120</button>
        <button>💬 15</button>
        <button>🔗 Share</button>
      </div>
    </div>
  </div>

  <!-- Video Card 2 -->
  <div class="video-card">
    <video src="https://www.w3schools.com/html/movie.mp4" controls></video>
    <div class="video-info">
      <h3>Awesome Video #2</h3>
      <div class="video-actions">
        <button>👍 95</button>
        <button>💬 8</button>
        <button>🔗 Share</button>
      </div>
    </div>
  </div>
</main>

<footer>
  &copy; 2026 BIGULA - Creator Video Platform
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// 🔥 Replace with your Firebase config
const firebaseConfig = {
 apiKey: "AIzaSyB8wGlVLw7ECGTQns65Ff8UyTT_on8OivY",
  authDomain: "bigula-d8cab.firebaseapp.com",
  projectId: "bigula-d8cab",
  storageBucket: "bigula-d8cab.firebasestorage.app",
  messagingSenderId: "76364446956",
  appId: "1:76364446956:web:4417b1c46d6feca02ff9c9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginBtn = document.getElementById("loginBtn");
const dashboardBtn = document.getElementById("dashboardBtn");
const uploadBtn = document.getElementById("uploadBtn");

let currentUser = null;

// Monitor auth state
onAuthStateChanged(auth, user => {
  currentUser = user;
  if(user) {
    loginBtn.style.display = "none";
    dashboardBtn.style.display = "inline-block";
  } else {
    loginBtn.style.display = "inline-block";
    dashboardBtn.style.display = "none";
  }
});

// Upload button click
uploadBtn.addEventListener('click', () => {
  if(!currentUser) {
    alert("Please login first to upload.");
    location.href = 'login.html';
  } else {
    location.href = 'upload.html';
  }
});
</script>

</body>
</html>
