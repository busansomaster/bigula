<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA – Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#000;color:#fff;overflow-y:auto;}
.topbar{position:fixed;top:0;width:100%;min-height:100px;background:linear-gradient(to bottom,#000 80%,transparent);z-index:20;padding:10px 15px;display:flex;flex-direction:column;transition:top .3s;}
.logo{font-size:32px;font-weight:900;letter-spacing:4px;color:#ff0000;text-shadow:0 0 20px rgba(255,0,0,.8);}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-top:5px;}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;}
.btn{padding:8px 16px;border-radius:25px;border:none;font-weight:800;cursor:pointer;transition:.3s;font-size:14px;min-width:80px;white-space:nowrap;}
.login-btn{background:#fff;color:#000;}
.upload-btn{background:#007BFF;color:#fff;}
.upload-btn.disabled{opacity:.4;cursor:not-allowed;}
#installBtn{background:#00cc00;color:#000;}
.search{font-size:44px;cursor:pointer;color:#ff0000;margin-left:10px;}
.search-bar{position:fixed;top:140px;width:100%;background:#111;padding:10px 15px;display:none;z-index:19;border-bottom:1px solid #222;}
.search-bar input{width:100%;padding:12px;border-radius:40px;border:1px solid #333;background:#000;color:#fff;font-size:16px;}
.tabs{display:flex;gap:20px;margin-top:10px;}
.tab{cursor:pointer;font-weight:700;opacity:.6;transition:.3s;font-size:16px;}
.tab.active{opacity:1;color:#ff0000;border-bottom:2px solid #ff0000;padding-bottom:2px;}
.feed{margin-top:180px;margin-bottom:70px;width:100%;display:flex;flex-direction:column;align-items:center;overflow-y:auto;scroll-snap-type:y mandatory;gap:20px;}
.video-card{width:95%;max-width:800px;background:#ff66cc;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;scroll-snap-align:start;position:relative;}
video{width:100%;height:auto;max-height:450px;object-fit:cover;display:block;}
.meta-overlay{padding:10px;display:flex;flex-direction:column;gap:8px;background:#000c; border-radius:0 0 15px 15px;}
.user-row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;}
.username{font-weight:900;font-size:16px;cursor:pointer;color:#fff;}
.follow-btn,.share-btn,.views-btn{background:#000;color:#fff;padding:5px 12px;border-radius:15px;font-size:14px;cursor:pointer;font-weight:700;margin-left:5px;}
.title{font-size:16px;font-weight:700;color:#fff;}
.stats{display:flex;gap:10px;margin-top:5px;}
.stat-btn{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.5);padding:6px 10px;border-radius:20px;cursor:pointer;font-weight:700;font-size:14px;}
.stat-btn span{color:#fff;}
.comment-modal{position:fixed;bottom:0;width:100%;height:60%;background:#111;display:none;flex-direction:column;border-top:3px solid #ff0000;z-index:50;}
.comment-list{flex:1;overflow-y:auto;padding:15px;}
.comment-input{display:flex;border-top:1px solid #333;}
.comment-input input{flex:1;padding:12px;background:#000;border:none;color:#fff;font-size:16px;}
.comment-input button{background:#ff0000;border:none;padding:12px 20px;color:#fff;font-weight:bold;cursor:pointer;font-size:16px;}
.footer{position:fixed;bottom:0;width:100%;height:70px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;font-size:24px;}
.footer div{cursor:pointer;transition:.3s;}
.footer div.disabled{opacity:.4;pointer-events:none;}
.footer div:hover:not(.disabled){color:#ff0000;}
.share-options{display:none;position:absolute;bottom:50px;right:10px;background:#000;padding:10px;border-radius:10px;flex-direction:column;gap:5px;}
.share-options button{background:#333;color:#fff;padding:5px 10px;border-radius:10px;cursor:pointer;}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="top-row">
    <div class="logo">BIGULA</div>
    <div class="actions">
      <div class="search">🔍</div>
      <button class="btn login-btn">Login</button>
      <button class="btn upload-btn disabled">Upload</button>
      <button class="btn" id="installBtn">Install App</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-feed="foryou">For You</div>
    <div class="tab" data-feed="latest">Latest</div>
    <div class="tab" data-feed="viral">Viral</div>
  </div>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search videos or creators...">
</div>

<div class="feed" id="feed"></div>

<div class="comment-modal" id="commentModal">
  <div class="comment-list" id="commentList"></div>
  <div class="comment-input">
    <input type="text" id="commentText" placeholder="Write a comment...">
    <button id="postCommentBtn">Post</button>
  </div>
</div>

<div class="footer">
  <div onclick="location.href='home.html'">🏠</div>
  <div id="notifBtn" class="disabled">🔔</div>
  <div id="accountBtn">👤</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const SUPABASE_URL = "https://uyuofjiiptnbbcuntbfi.supabase.co"
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dW9mamlpcHRuYmJjdW50YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMzQ3MjcsImV4cCI6MjA4NzkxMDcyN30.-FBKM7NKTSm20qzkExueYhqrE6oaK6a6de1qCsl2nuQ"
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

let currentUser = null;
let currentVideoId = null;

// --- User ---
async function initUser(){
  const { data: { user } } = await supabase.auth.getUser()
  currentUser = user
  const loginBtn = document.querySelector(".login-btn")
  const uploadBtn = document.querySelector(".upload-btn")
  const accountBtn = document.getElementById("accountBtn")
  const notifBtn = document.getElementById("notifBtn")
  if(user){
    loginBtn.textContent="Dashboard"
    loginBtn.onclick=()=>location.href="dashboard.html"
    uploadBtn.classList.remove("disabled")
    uploadBtn.onclick=()=>location.href="upload.html"
    accountBtn.onclick=()=>location.href="account.html"
    notifBtn.classList.remove("disabled")
  } else {
    loginBtn.onclick=()=>location.href="signup.html"
    accountBtn.classList.add("disabled")
    notifBtn.classList.add("disabled")
  }
}
initUser()

// --- Fetch videos ---
async function fetchVideos(type="foryou"){
  let query = supabase.from("videos").select("*")
  if(type==="latest") query = query.order("created_at",{ascending:false})
  if(type==="viral") query = query.order("views",{ascending:false})
  const { data, error } = await query
  if(error){ 
    console.error(error); 
    document.getElementById("feed").innerHTML="<p style='color:red;text-align:center;margin-top:20px;'>Failed to load videos.</p>";
    return
  }
  renderVideos(data)
}

// --- Counts ---
async function getCounts(videoId){
  const { count: likes } = await supabase.from("likes").select("*",{head:true}).eq("video_id",videoId)
  const { count: comments } = await supabase.from("comments").select("*",{head:true}).eq("video_id",videoId)
  const { count: views } = await supabase.from("views").select("*",{head:true}).eq("video_id",videoId)
  return { likes, comments, views }
}

// --- Render videos ---
async function renderVideos(videos){
  const feed = document.getElementById("feed")
  feed.innerHTML=""
  for(const video of videos){
    const counts = await getCounts(video.id)
    const card = document.createElement("div")
    card.className="video-card"
    card.innerHTML=`
      <video src="${video.video_url}" autoplay playsinline></video>
      <div class="meta-overlay">
        <div class="user-row">
          <span class="username" onclick="openProfile('${video.creator_id}')">@${video.username||'user'}</span>
          <div>
            <button class="views-btn">👁️ ${counts.views||0}</button>
            <button class="follow-btn" onclick="followUser('${video.creator_id}')">Follow</button>
            <button class="share-btn" onclick="toggleShare(this)">Share</button>
            <div class="share-options">
              <button onclick="shareStatus('${video.id}','${video.username||'user'}')">Bigula Status</button>
              <button onclick="shareWhatsApp('${video.video_url}','${video.username||'user'}')">WhatsApp</button>
            </div>
          </div>
        </div>
        <div class="title">${video.title||''}</div>
        <div class="stats">
          <div class="stat-btn" onclick="toggleLike('${video.id}', this)">❤️ <span id="like-${video.id}">${counts.likes||0}</span></div>
          <div class="stat-btn" onclick="openComments('${video.id}')">💬 <span id="commentCount-${video.id}">${counts.comments||0}</span></div>
        </div>
      </div>
    `
    feed.appendChild(card)
    setupVideoAutoScroll(card)
  }
  setupAutoplay()
}

// --- Autoplay & hide header ---
function setupAutoplay(){
  const vids = document.querySelectorAll("video")
  const topbar = document.getElementById("topbar")

  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const video = entry.target

      if(entry.isIntersecting){
        video.volume = 1
        video.play()

        // hide header while video is active
        topbar.style.top = "-120px"
      } else {
        video.pause()
        topbar.style.top = "0"
      }
    })
  }, { threshold: 0.75 })

  vids.forEach(v=>observer.observe(v))
}
function setupVideoAutoScroll(card){
  const video = card.querySelector("video")
  video.addEventListener("ended", ()=>{
    const next = card.nextElementSibling
if(next) next.scrollIntoView({behavior:"smooth", block:"center"})
  })
}

// --- Share functions ---
function toggleShare(btn){
  const options = btn.nextElementSibling
  if(!options) return
  options.style.display = options.style.display==="flex" ? "none" : "flex"
  options.style.flexDirection="column"
}

function shareWhatsApp(url, username){
  const text = `Watch this BIGULA video created by @${username}: ${url}`
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank')
}

function shareStatus(videoId, username){
  alert(`Status portal for video ${videoId} by @${username} coming soon!`)
}

// --- Actions ---
function openProfile(uid){ location.href=`account.html?uid=${uid}` }

async function toggleLike(videoId, btn){
  if(!currentUser) return location.href='signup.html'
  const likeEl = document.getElementById(`like-${videoId}`)
  const { data: exists } = await supabase.from('likes').select("*").eq('video_id', videoId).eq('user_id', currentUser.id)
  if(exists && exists.length){
    await supabase.from('likes').delete().eq('video_id', videoId).eq('user_id', currentUser.id)
    likeEl.innerText = parseInt(likeEl.innerText)-1
  } else {
    await supabase.from('likes').insert({ video_id: videoId, user_id: currentUser.id })
    likeEl.innerText = parseInt(likeEl.innerText)+1
  }
}

async function openComments(videoId){
  if(!currentUser) return location.href='signup.html'
  currentVideoId = videoId
  const modal = document.getElementById("commentModal")
  const list = document.getElementById("commentList")
  list.innerHTML=""
  modal.style.display="flex"
  const { data: comments } = await supabase.from("comments").select("*").eq("video_id",videoId).order("created_at",{ascending:true})
  if(comments) comments.forEach(c=>{
    const div = document.createElement("div")
    div.innerHTML=`<strong>${c.username}</strong>: ${c.text}`
    list.appendChild(div)
  })
}

document.getElementById("postCommentBtn").onclick = async ()=>{
  if(!currentUser || !currentVideoId) return location.href='signup.html'
  const text = document.getElementById("commentText").value
  if(!text) return
  await supabase.from("comments").insert({ video_id: currentVideoId, user_id: currentUser.id, username: currentUser.email.split("@")[0], text })
  document.getElementById("commentText").value=''
  openComments(currentVideoId)
}

async function followUser(uid){
  if(!currentUser) return location.href='signup.html'
  await supabase.from('followers').upsert({ follower_id: currentUser.id, following_id: uid }, { onConflict:['follower_id','following_id'] })
  alert('Following!')
}

// --- Tabs ---
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))
    tab.classList.add("active")
    fetchVideos(tab.dataset.feed)
  }
})

// --- Search ---
document.querySelector(".search").onclick=()=>{ document.querySelector(".search-bar").style.display="block" }
document.getElementById("searchInput").addEventListener("input",e=>{
  const term=e.target.value.toLowerCase()
  document.querySelectorAll(".video-card").forEach(card=>{
    card.style.display = card.innerText.toLowerCase().includes(term) ? "flex" : "none"
  })
})

// --- Install App ---
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');
installBtn.style.display = 'none';
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});

fetchVideos()
</script>
</body>
</html>
