<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial; }
body { background:#000; color:#fff; }

.top-nav {
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #222;
  z-index:1000;
}

.filter-scroll {
  display:flex;
  overflow-x:auto;
  gap:8px;
}

.filter-btn {
  flex:0 0 auto;
  background:none;
  border:none;
  color:#aaa;
  font-weight:bold;
  cursor:pointer;
  padding:6px 12px;
  border-radius:20px;
}

.filter-btn.active { color:#ff0050; border:1px solid #ff0050; }

#loginBtn {
  background:#ff0050;
  border:none;
  padding:6px 14px;
  border-radius:20px;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
}

.search-bar {
  position:fixed;
  top:60px;
  width:100%;
  padding:10px;
  background:#111;
  display:none;
}

.search-bar input {
  width:100%;
  padding:10px;
  border-radius:25px;
  border:none;
}

.feed {
  margin-top:110px;
  margin-bottom:80px;
  padding:10px;
}

.video-card { margin-bottom:30px; }
video { width:100%; border-radius:12px; }

.video-info h3 { font-size:16px; margin-top:6px; }
.video-info p { font-size:13px; color:#bbb; }

.actions {
  display:flex;
  gap:15px;
  margin-top:6px;
}

.actions button {
  background:none;
  border:none;
  color:#fff;
  cursor:pointer;
}

.actions button.disabled {
  opacity:0.4;
  cursor:not-allowed;
}

.footer {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
}

.footer button {
  font-size:20px;
  padding:10px;
  border:none;
  background:none;
  color:#fff;
  cursor:pointer;
}

.footer button:hover { color:#ff0050; }
</style>
</head>
<body>

<div class="top-nav">
  <button id="searchBtn">🔍</button>
  <div class="filter-scroll">
    <button class="filter-btn" id="forYouBtn">For You</button>
    <button class="filter-btn" id="latestBtn">Latest</button>
    <button class="filter-btn" id="viralBtn">Viral</button>
  </div>
  <button id="loginBtn" onclick="goLogin()">Login</button>
</div>

<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="Search users or titles...">
</div>

<div class="feed" id="feed"></div>

<div class="footer">
  <button>🔔</button>
  <button onclick="location.href='home.html'">🏠</button>
  <button onclick="location.href='account.html'">👤</button>
</div>

<script type="module">
import { baseVideos } from './data.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "bigula-d8cab.firebaseapp.com",
  projectId: "bigula-d8cab"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let currentUser = null;
const loginBtn = document.getElementById("loginBtn");

onAuthStateChanged(auth, user => {
  currentUser = user;
  if(currentUser) {
    loginBtn.textContent = "My Dashboard";
    loginBtn.onclick = () => location.href='dashboard.html';
  } else {
    loginBtn.textContent = "Login";
    loginBtn.onclick = goLogin;
  }
});

function goLogin() {
  location.href = 'login.html';
}

const feed = document.getElementById("feed");

function getStats() { return JSON.parse(localStorage.getItem("videoStats")) || {}; }
function saveStats(stats) { localStorage.setItem("videoStats", JSON.stringify(stats)); }
function ensureVideoStats(videoId) {
  let stats = getStats();
  if(!stats[videoId]) { stats[videoId] = { views:0, likes:0, comments:0 }; saveStats(stats); }
}

function renderVideos(videoList) {
  feed.innerHTML = "";
  videoList.forEach(video => {
    ensureVideoStats(video.id);
    let stats = getStats()[video.id];
    const card = document.createElement("div");
    card.className = "video-card";
    card.innerHTML = `
      <video src="${video.videoUrl}" data-id="${video.id}"></video>
      <div class="video-info">
        <h3>${video.title}</h3>
        <p>${video.description}</p>
        <p>@${video.creator}</p>
        <p>${new Date(video.createdAt).toLocaleString()}</p>
        <div class="actions">
          <button class="like-btn" data-id="${video.id}">❤️ ${stats.likes}</button>
          <button class="comment-btn" data-id="${video.id}">💬 ${stats.comments}</button>
          <span>👁 ${stats.views}</span>
        </div>
      </div>
    `;
    feed.appendChild(card);
  });
  attachEvents();
}

function attachEvents() {
  document.querySelectorAll("video").forEach(video => {
    video.addEventListener("play", () => {
      const id = video.dataset.id;
      let stats = getStats();
      stats[id].views++;
      saveStats(stats);
      renderVideos(currentVideos);
    });
  });

  document.querySelectorAll(".like-btn").forEach(btn => {
    if(!currentUser) { btn.classList.add("disabled"); btn.onclick = () => alert("Login to like videos"); }
    else { btn.onclick = () => { let id = btn.dataset.id; let stats = getStats(); stats[id].likes++; saveStats(stats); renderVideos(currentVideos); }; }
  });

  document.querySelectorAll(".comment-btn").forEach(btn => {
    if(!currentUser) { btn.classList.add("disabled"); btn.onclick = () => alert("Login to comment"); }
    else { btn.onclick = () => { let id = btn.dataset.id; let stats = getStats(); stats[id].comments++; saveStats(stats); renderVideos(currentVideos); }; }
  });
}

let currentVideos = [...baseVideos];

// Default tab: For You
currentVideos.sort(()=>0.5-Math.random());
renderVideos(currentVideos);

document.getElementById("latestBtn").onclick = () => {
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  latestBtn.classList.add("active");
  currentVideos.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  renderVideos(currentVideos);
};

document.getElementById("viralBtn").onclick = () => {
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  viralBtn.classList.add("active");
  let stats = getStats();
  currentVideos.sort((a,b)=> (stats[b.id]?.views||0)-(stats[a.id]?.views||0));
  renderVideos(currentVideos);
};

document.getElementById("forYouBtn").onclick = () => {
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  forYouBtn.classList.add("active");
  currentVideos.sort(()=>0.5-Math.random());
  renderVideos(currentVideos);
};

// Search
document.getElementById("searchBtn").onclick = ()=>{ document.getElementById("searchBar").style.display="block"; };
document.getElementById("searchInput").addEventListener("input", e=>{
  const q = e.target.value.toLowerCase();
  const filtered = baseVideos.filter(v =>
    v.title.toLowerCase().includes(q) || v.creator.toLowerCase().includes(q)
  );
  renderVideos(filtered);
});
</script>

</body>
</html>
