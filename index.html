<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA Splash</title>
<style>
  /* Full-screen splash */
  body, html { margin:0; padding:0; width:100%; height:100%; font-family:Arial,sans-serif; background:#121212; color:#fff; }
  #splash { display:flex; justify-content:center; align-items:center; height:100%; flex-direction:column; transition:opacity 1s; }
  #splash h1 { font-size:2rem; color:#ff4d4f; animation: bounce 1.5s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* Overlay */
  #overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:none; flex-direction:column; justify-content:center; align-items:center; padding:20px; }
  .overlay-step { display:none; text-align:center; }
  .overlay-step.active { display:block; }
  .overlay-step h2 { color:#ff4d4f; margin-bottom:15px; }
  .overlay-step p { font-size:16px; margin-bottom:20px; }
  .overlay-buttons { display:flex; gap:10px; justify-content:center; }
  .overlay-buttons button { padding:10px 20px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
  .next-btn { background:#ff4d4f; color:#fff; }
  .skip-btn { background:#555; color:#fff; }
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <h1>Welcome to BIGULA</h1>
</div>

<!-- Onboarding Overlay -->
<div id="overlay">
  <div class="overlay-step active">
    <h2>Discover Amazing Content</h2>
    <p>Watch trending videos and discover creators from all over the world.</p>
  </div>
  <div class="overlay-step">
    <h2>Upload Your Own Videos</h2>
    <p>Share your creativity and connect with fans easily.</p>
  </div>
  <div class="overlay-step">
    <h2>Make money from your content</h2>
    <p>Monetize your videos through ads and grow your audience.</p>
  </div>
  <div class="overlay-buttons">
    <button class="skip-btn" onclick="skipOverlay()">Skip</button>
    <button class="next-btn" onclick="nextStep()">Next</button>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.34.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.34.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.34.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.34.0/firebase-storage-compat.js"></script>
<script>
  // TODO: Replace with your Firebase config
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "bigula-d8cab.firebaseapp.com",
    projectId: "bigula-d8cab",
    storageBucket: "bigula-d8cab.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();
</script>

<script>
const splash = document.getElementById('splash');
const overlay = document.getElementById('overlay');
const steps = document.querySelectorAll('.overlay-step');
let currentStep = 0;

// Check if user has visited before
const firstVisit = localStorage.getItem('bigula_first_visit');

function showOverlay() {
  splash.style.opacity = 0;
  setTimeout(() => {
    splash.style.display = 'none';
    overlay.style.display = 'flex';
  }, 1000);
}

// Only show onboarding if first visit
if(!firstVisit) {
  setTimeout(showOverlay, 2000);
  localStorage.setItem('bigula_first_visit', 'true');
} else {
  // Skip overlay, show splash briefly then redirect
  setTimeout(() => {
    splash.style.opacity = 0;
    setTimeout(() => window.location.href = 'home.html', 1000);
  }, 2000);
}

function nextStep() {
  steps[currentStep].classList.remove('active');
  currentStep++;
  if(currentStep >= steps.length) {
    window.location.href = 'home.html';
    return;
  }
  steps[currentStep].classList.add('active');
}

function skipOverlay() {
  window.location.href = 'home.html';
}
</script>

</body>
</html>
