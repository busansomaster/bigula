<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIGULA - Creator Video Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; }
    header {
      background-color: #1f1f1f;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { color: #ff4d4f; font-size: 1.5rem; }
    nav button {
      margin-left: 10px;
      background-color: #ff4d4f;
      border: none;
      color: #fff;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    main { max-width: 600px; margin: 20px auto; padding: 0 10px; max-height: 80vh; overflow-y: scroll; }
    .video-card { background-color: #1a1a1a; margin-bottom: 20px; border-radius: 10px; overflow: hidden; padding: 10px; }
    .video-card video { width: 100%; border-radius: 10px; }
    .video-info { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
    .video-info h3 { font-size: 1rem; color: #fff; }
    .video-actions button { background: none; border: none; color: #fff; cursor: pointer; margin-left: 10px; font-size: 1.2rem; }
    footer { text-align: center; padding: 15px; background-color: #1f1f1f; margin-top: 20px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>BIGULA</h1>
    <nav>
      <button onclick="location.href='login.html'">Login</button>
      <button onclick="alert('For You feed coming soon!')">For You</button>
      <button onclick="location.href='upload.html'">Upload</button>
    </nav>
  </header>

  <main>
    <!-- Video Card 1 -->
    <div class="video-card">
      <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls></video>
      <div class="video-info">
        <h3>Awesome Video #1</h3>
        <div class="video-actions">
          <button>👍 120</button>
          <button>💬 15</button>
          <button>🔗 Share</button>
        </div>
      </div>
    </div>

    <!-- Video Card 2 -->
    <div class="video-card">
      <video src="https://www.w3schools.com/html/movie.mp4" controls></video>
      <div class="video-info">
        <h3>Awesome Video #2</h3>
        <div class="video-actions">
          <button>👍 95</button>
          <button>💬 8</button>
          <button>🔗 Share</button>
        </div>
      </div>
    </div>

  </main>

  <footer>
    &copy; 2026 BIGULA - Creator Video Platform
  </footer>
</body>
</html>
