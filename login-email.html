<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Email Login - BIGULA</title>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  "https://uyuofjiiptnbbcuntbfi.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dW9mamlpcHRuYmJjdW50YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMzQ3MjcsImV4cCI6MjA4NzkxMDcyN30.-FBKM7NKTSm20qzkExueYhqrE6oaK6a6de1qCsl2nuQ"
)

window.login = async () => {
  const email = emailInput.value
  const password = passwordInput.value

  const { error } = await supabase.auth.signInWithPassword({ email, password })
  if (error) return show(error.message)

  window.location.href = "home.html"
}

window.signup = async () => {
  const email = emailInput.value
  const password = passwordInput.value

  const { error } = await supabase.auth.signUp({ email, password })
  if (error) return show(error.message)

  show("Check your email to confirm signup.")
}

function show(msg){
  message.innerText = msg
}
</script>

<style>
body { background:#121212; color:white; display:flex; justify-content:center; align-items:center; height:100vh; }
.box { background:#1f1f1f; padding:30px; border-radius:10px; width:320px; text-align:center; }
input,button { width:100%; padding:10px; margin:8px 0; border:none; border-radius:5px; }
button { background:#ff4d4f; color:white; cursor:pointer; }
#message { font-size:14px; color:#ff4d4f; }
</style>
</head>

<body>
<div class="box">
<h2>Email Login</h2>
<input id="emailInput" type="email" placeholder="Email">
<input id="passwordInput" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>
<div id="message"></div>
<a href="login.html" style="color:#ff4d4f">Back</a>
</div>
</body>
</html>
