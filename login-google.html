<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Login - BIGULA</title>
<style>
body { font-family: Arial,sans-serif; background:#121212; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.login-box { background:#1f1f1f; padding:30px; border-radius:10px; width:300px; text-align:center; }
button { width:100%; padding:10px; margin:8px 0; border-radius:5px; border:none; font-weight:bold; cursor:pointer; background:#4285F4; color:#fff; }
a { color:#ff4d4f; display:block; margin-top:15px; text-decoration:none; }
</style>
</head>
<body>
<div class="login-box">
<h2>BIGULA Google Login</h2>
<button onclick="googleLogin()">Sign in with Google</button>
<a href="login.html">Back to Login Options</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "bigula-d8cab.firebaseapp.com",
  projectId: "bigula-d8cab",
  storageBucket: "bigula-d8cab.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.googleLogin = function() {
  signInWithPopup(auth, provider)
    .then(() => { alert("Login successful!"); window.location.href="index.html"; })
    .catch(e => alert(e.message));
};
</script>
</body>
</html>
