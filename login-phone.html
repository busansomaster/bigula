<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Login - BIGULA</title>
<style>
body { font-family: Arial,sans-serif; background:#121212; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.login-box { background:#1f1f1f; padding:30px; border-radius:15px; width:320px; text-align:center; box-shadow:0 0 10px #ff4d4f; }
h2 { color:#ff4d4f; margin-bottom:20px; }
input { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:none; font-size:16px; }
button { width:100%; padding:12px; margin:10px 0; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer; transition:0.2s; }
button:disabled { background:#555; cursor:not-allowed; }
.send-btn { background:#ff4d4f; color:#fff; }
.verify-btn { background:#ff4d4f; color:#fff; }
#recaptcha-container { margin-top:10px; }
a { color:#ff4d4f; text-decoration:none; display:block; margin-top:15px; }
</style>
</head>
<body>

<div class="login-box">
<h2>BIGULA Phone Login</h2>

<input type="text" id="phone" placeholder="+255XXXXXXXXX">
<button class="send-btn" id="sendBtn" onclick="sendOTP()">Send OTP</button>

<input type="text" id="otp" placeholder="Enter OTP" disabled>
<button class="verify-btn" id="verifyBtn" onclick="verifyOTP()" disabled>Verify OTP</button>

<div id="recaptcha-container"></div>
<a href="login.html">Back to Login Options</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// 🔥 REPLACE WITH YOUR CONFIG
const firebaseConfig = {
 apiKey: "AIzaSyB8wGlVLw7ECGTQns65Ff8UyTT_on8OivY",
  authDomain: "bigula-d8cab.firebaseapp.com",
  projectId: "bigula-d8cab",
  storageBucket: "bigula-d8cab.firebasestorage.app",
  messagingSenderId: "76364446956",
  appId: "1:76364446956:web:4417b1c46d6feca02ff9c9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Setup reCAPTCHA
window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'normal' });

// Buttons
const sendBtn = document.getElementById("sendBtn");
const verifyBtn = document.getElementById("verifyBtn");
const otpInput = document.getElementById("otp");

window.sendOTP = function() {
  const phone = document.getElementById("phone").value;
  if(!phone) { alert("Enter phone number"); return; }

  sendBtn.disabled = true;
  sendBtn.innerText = "Sending...";

  signInWithPhoneNumber(auth, phone, window.recaptchaVerifier)
    .then((confirmationResult) => {
      window.confirmationResult = confirmationResult;
      alert("OTP Sent!");
      // Enable OTP input & verify button
      otpInput.disabled = false;
      verifyBtn.disabled = false;
      sendBtn.innerText = "Send OTP";
    })
    .catch(error => {
      alert(error.message);
      sendBtn.disabled = false;
      sendBtn.innerText = "Send OTP";
    });
};

window.verifyOTP = function() {
  const code = otpInput.value;
  if(!code) { alert("Enter OTP"); return; }

  verifyBtn.disabled = true;
  verifyBtn.innerText = "Verifying...";

  window.confirmationResult.confirm(code)
    .then(() => { alert("Login successful!"); window.location.href="index.html"; })
    .catch(() => { alert("Invalid OTP"); verifyBtn.disabled = false; verifyBtn.innerText = "Verify OTP"; });
};
</script>

</body>
</html>
