<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phone Login - BIGULA</title>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  "https://uyuofjiiptnbbcuntbfi.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dW9mamlpcHRuYmJjdW50YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMzQ3MjcsImV4cCI6MjA4NzkxMDcyN30.-FBKM7NKTSm20qzkExueYhqrE6oaK6a6de1qCsl2nuQ"
)

window.sendOTP = async () => {
  const phone = phoneInput.value

  const { error } = await supabase.auth.signInWithOtp({ phone })
  if (error) return show(error.message)

  otpSection.style.display = "block"
}

window.verifyOTP = async () => {
  const phone = phoneInput.value
  const token = otpInput.value

  const { error } = await supabase.auth.verifyOtp({
    phone,
    token,
    type: 'sms'
  })

  if (error) return show(error.message)

  window.location.href = "home.html"
}

function show(msg){
  message.innerText = msg
}
</script>

<style>
body { background:#121212; color:white; display:flex; justify-content:center; align-items:center; height:100vh; }
.box { background:#1f1f1f; padding:30px; border-radius:10px; width:320px; text-align:center; }
input,button { width:100%; padding:10px; margin:8px 0; border:none; border-radius:5px; }
button { background:#ff4d4f; color:white; cursor:pointer; }
#otpSection { display:none; }
#message { color:#ff4d4f; font-size:14px; }
</style>
</head>

<body>
<div class="box">
<h2>Phone Login</h2>
<input id="phoneInput" placeholder="+2567XXXXXXXX">
<button onclick="sendOTP()">Send OTP</button>

<div id="otpSection">
<input id="otpInput" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify</button>
</div>

<div id="message"></div>
<a href="login.html" style="color:#ff4d4f">Back</a>
</div>
</body>
</html>
