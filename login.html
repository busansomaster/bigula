<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#121212;color:white;display:flex;justify-content:center;align-items:center;height:100vh;}
.container{width:100%;max-width:400px;background:#1f1f2f;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);}
h1{text-align:center;margin-bottom:25px;color:#ff4d4f;}
input, button{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:none;font-size:15px;}
input{background:#2a2a40;color:white;}
input:focus{outline:none;border:1px solid #ff4d4f;}
button{background:#ff4d4f;color:white;cursor:pointer;transition:.3s;font-weight:bold;}
button:hover:not(.disabled){background:#e03a3a;}
button.disabled{opacity:.5;cursor:not-allowed;}
.hidden{display:none;}
#message{margin-bottom:12px;text-align:center;padding:10px;border-radius:8px;display:none;}
#message.error{background:#a00;color:white;}
#message.success{background:#0a0;color:white;}
.select-method{display:flex;gap:10px;margin-bottom:20px;}
.select-method button{flex:1;}
.link{text-align:center;font-size:14px;margin-top:10px;}
.link a{color:#ff4d4f;text-decoration:none;}
</style>
</head>
<body>

<div class="container">
  <h1>BIGULA Login</h1>
  <div id="message"></div>

  <div id="login-methods" class="select-method">
    <button id="google-btn">Google</button>
    <button class="disabled" title="Phone login disabled">Phone</button>
    <button id="email-btn">Email</button>
  </div>

  <div id="email-form" class="hidden">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="login-btn">Login</button>
    <div class="link">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </div>
</div>

<script type="module">
const messageBox = document.getElementById('message');
function showMessage(text, type='error'){
  messageBox.textContent = text;
  messageBox.className = type==='error' ? 'error' : 'success';
  messageBox.style.display = 'block';
}

// Google Login
document.getElementById('google-btn').onclick = async ()=>{
  const { error } = await window.supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/home.html' }
  });
  if(error) showMessage(error.message, 'error');
};

// Show Email Form
document.getElementById('email-btn').onclick = ()=>{
  document.getElementById('login-methods').classList.add('hidden');
  document.getElementById('email-form').classList.remove('hidden');
};

// Email Login
document.getElementById('login-btn').onclick = async ()=>{
  messageBox.style.display='none';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  if(!email || !password) return showMessage("Enter email and password", 'error');

  const { data, error } = await window.supabase.auth.signInWithPassword({ email, password });
  if(error) return showMessage(error.message, 'error');

  showMessage("Login successful! Redirecting...", 'success');
  setTimeout(()=>window.location.href='home.html', 1200);
};
</script>

</body>
</html>
