<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA – Login</title>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  "https://uyuofjiiptnbbcuntbfi.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dW9mamlpcHRuYmJjdW50YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMzQ3MjcsImV4cCI6MjA4NzkxMDcyN30.-FBKM7NKTSm20qzkExueYhqrE6oaK6a6de1qCsl2nuQ"
);

// Inline message helper
function showMessage(msg, color="#ff4d4f") {
  const m = document.getElementById("msg");
  m.textContent = msg;
  m.style.color = color;
  m.style.display = "block";
}

// Email/password login
window.loginWithEmail = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  if(!email || !password) return showMessage("Enter email and password");

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error) return showMessage(error.message);
  
  // Success
  showMessage("Login successful!", "#00ff99");
  setTimeout(()=>{ window.location.href="home.html"; }, 800);
}

// Google login
window.loginWithGoogle = async () => {
  const { data, error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin + "/home.html"
    }
  });
  if(error) return showMessage(error.message);
}

// Go to signup
window.gotoSignup = () => window.location.href="signup.html";

</script>

<style>
body { background:#121212; color:white; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Segoe UI',sans-serif; margin:0;}
.container { background:#1f1f1f; padding:30px; border-radius:12px; width:90%; max-width:400px; text-align:center;}
h1{ margin-bottom:20px; color:#ff0000;}
input { width:100%; padding:14px; margin:8px 0; border:none; border-radius:8px; background:#2a2a40; color:white; font-size:15px;}
input:focus { outline:2px solid #6c5ce7;}
button { width:100%; padding:14px; margin:10px 0; border:none; border-radius:8px; font-size:16px; cursor:pointer; font-weight:bold; transition:0.3s;}
button:hover { opacity:0.9; }
.email-btn { background:#6c5ce7; color:white;}
.google-btn { background:#4285F4; color:white;}
.signup-link { margin-top:12px; display:block; color:#ff4d4f; cursor:pointer; text-decoration:none;}
#msg { display:none; margin-top:10px; font-size:14px;}
</style>
</head>
<body>

<div class="container">
  <h1>BIGULA Login</h1>

  <input type="email" id="email" placeholder="Email address">
  <input type="password" id="password" placeholder="Password">
  <button class="email-btn" onclick="loginWithEmail()">Login with Email</button>

  <button class="google-btn" onclick="loginWithGoogle()">Sign in with Google</button>

  <a class="signup-link" onclick="gotoSignup()">Don't have an account? Sign up</a>

  <div id="msg"></div>
</div>

</body>
</html>
