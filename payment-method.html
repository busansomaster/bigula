<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA - Payment Method</title>
<style>
  body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .payment-box { background: #1f1f1f; padding: 30px; border-radius: 15px; width: 350px; text-align: center; }
  input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
  button { background-color: #ff4d4f; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
  .success { background: #28a745; padding: 10px; border-radius: 5px; margin-top: 15px; }
</style>
</head>
<body>
<div class="payment-box">
  <h2>Add Payment Method</h2>
  <select id="paymentMethod">
    <option value="">Select Payment Method</option>
    <option value="paypal">PayPal</option>
    <option value="bank">Bank Transfer</option>
    <option value="mobileMoney">Mobile Money</option>
  </select>
  <input type="text" id="accountName" placeholder="Account Holder Name">
  <input type="text" id="accountNumber" placeholder="Account Number / Phone / Email">
  <button id="saveBtn">Save Payment Method</button>
  <div id="statusMsg"></div>
</div>

<script>
// Example user object
let user = {
  monetizationStatus: "Pending",
  payoutEligible: false,
  paymentMethod: null
};

document.getElementById('saveBtn').addEventListener('click', () => {
  const method = document.getElementById('paymentMethod').value;
  const name = document.getElementById('accountName').value.trim();
  const number = document.getElementById('accountNumber').value.trim();
  const statusDiv = document.getElementById('statusMsg');

  if(!method || !name || !number) {
    statusDiv.innerHTML = "<div style='color:#ff4d4f'>Please fill all fields!</div>";
    return;
  }

  // Simulate saving to database (replace with Firestore later)
  user.paymentMethod = { method, name, number };
  user.monetizationStatus = "Active";
  user.payoutEligible = true;

  // Lock form
  document.getElementById('paymentMethod').disabled = true;
  document.getElementById('accountName').disabled = true;
  document.getElementById('accountNumber').disabled = true;
  document.getElementById('saveBtn').disabled = true;

  statusDiv.innerHTML = "<div class='success'>Payment Method Added Successfully! You are now monetized 🎉</div>";

  // Redirect to creator dashboard after 2s
  setTimeout(() => {
    location.href = 'creator-earnings.html';
  }, 2000);
});
</script>
</body>
</html>
