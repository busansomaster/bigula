<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA – Sign Up</title>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient(
  'https://uyuofjiiptnbbcuntbfi.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dW9mamlpcHRuYmJjdW50YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMzQ3MjcsImV4cCI6MjA4NzkxMDcyN30.-FBKM7NKTSm20qzkExueYhqrE6oaK6a6de1qCsl2nuQ'
);

const showMessage = (msg, type='error')=>{
  const m = document.getElementById('message');
  m.textContent = msg;
  m.className = type==='error' ? 'error' : 'success';
  m.style.display='block';
}

document.addEventListener('DOMContentLoaded', ()=>{
  const signupBtn = document.getElementById('signup-btn');
  const loginRedirect = document.getElementById('login-redirect');

  signupBtn.onclick = async ()=>{
    document.getElementById('message').style.display='none';
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if(!username || !email || !password){
      return showMessage("Fill all fields");
    }

    // Signup without email verification
    const { data, error } = await supabase.auth.signUp({
      email, password, options: { data: { username } }
    });

    if(error) return showMessage(error.message);

    // Automatically logged in
    const user = data.user;
    showMessage("Signup successful! Redirecting...", 'success');

    // Optional: Create a profile row
    await supabase.from('users').upsert([{id:user.id, username}]);

    setTimeout(()=>window.location.href='home.html',1200);
  }

  loginRedirect.onclick = ()=>{
    window.location.href='login.html';
  }
});
</script>

<style>
body{background:#121212;color:white;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;}
.container{width:100%;max-width:400px;background:#1f1f2f;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);}
h1{text-align:center;margin-bottom:25px;color:#ff4d4f;}
input, button{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:none;font-size:15px;}
input{background:#2a2a40;color:white;}
input:focus{outline:none;border:1px solid #ff4d4f;}
button{background:#ff4d4f;color:white;cursor:pointer;transition:.3s;font-weight:bold;}
button:hover{background:#e03a3a;}
#message{margin-bottom:12px;text-align:center;padding:10px;border-radius:8px;display:none;}
#message.error{background:#a00;color:white;}
#message.success{background:#0a0;color:white;}
</style>
</head>
<body>
<div class="container">
<h1>BIGULA Sign Up</h1>
<div id="message"></div>
<input type="text" id="username" placeholder="Username">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button id="signup-btn">Sign Up</button>
<button id="login-redirect" style="background:#444;">Back to Login</button>
</div>
</body>
</html>
