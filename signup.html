<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA – Sign Up</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#121212;color:white;display:flex;justify-content:center;align-items:center;height:100vh;}
.container{width:100%;max-width:400px;background:#1f1f2f;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);}
h1{text-align:center;margin-bottom:25px;color:#ff4d4f;}
button, input{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:none;font-size:15px;}
input{background:#2a2a40;color:white;}
input:focus{outline:none;border:1px solid #ff4d4f;}
button{background:#ff4d4f;color:white;cursor:pointer;transition:.3s;font-weight:bold;}
button:hover:not(.disabled){background:#e03a3a;}
button.disabled{opacity:.5;cursor:not-allowed;}
.select-method{display:flex;gap:10px;margin-bottom:20px;}
.select-method button{flex:1;}
.hidden{display:none;}
.avatar-preview{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:10px auto;}
.link{text-align:center;font-size:14px;margin-top:10px;}
.link a{color:#ff4d4f;text-decoration:none;}
#message{margin-bottom:12px;text-align:center;padding:10px;border-radius:8px;display:none;}
#message.error{background:#a00;color:white;}
#message.success{background:#0a0;color:white;}
</style>
</head>
<body>

<div class="container">
  <h1>BIGULA Sign Up</h1>
  <div id="message"></div>

  <!-- Step 1: Choose Signup Method -->
  <div id="signup-methods" class="select-method">
    <button onclick="chooseMethod('google')">Google</button>
    <button class="disabled" title="Phone signup disabled">Phone</button>
    <button onclick="chooseMethod('email')">Email</button>
  </div>

  <!-- Step 2: Profile Form -->
  <div id="profile-form" class="hidden">
    <img id="avatar-preview" src="https://via.placeholder.com/80" alt="Profile Photo">
    <input type="file" id="avatar" accept="image/*" />
    <input type="text" id="username" placeholder="Username" />
    <input type="text" id="display_name" placeholder="Display Name" />
    <input type="text" id="bio" placeholder="Bio (optional)" />
    <input type="email" id="email" placeholder="Email" class="hidden"/>
    <input type="password" id="password" placeholder="Password" class="hidden"/>
    <button id="signup-btn">Sign Up</button>
    <div class="link">Already have an account? <a href="login.html">Login</a></div>
  </div>
</div>

<script type="module">
const SUPABASE_URL="https://uyuofjiiptnbbcuntbfi.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dW9mamlpcHRuYmJjdW50YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMzQ3MjcsImV4cCI6MjA4NzkxMDcyN30.-FBKM7NKTSm20qzkExueYhqrE6oaK6a6de1qCsl2nuQ";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const messageBox = document.getElementById('message');
function showMessage(text, type='error'){
  messageBox.textContent = text;
  messageBox.className = type==='error' ? 'error' : 'success';
  messageBox.style.display = 'block';
}

// Avatar preview
const avatarInput = document.getElementById("avatar");
const avatarPreview = document.getElementById("avatar-preview");
avatarInput.addEventListener("change", e=>{
  const file = e.target.files[0];
  if(file) avatarPreview.src = URL.createObjectURL(file);
});

let signupMethod = null;

// Choose signup method
function chooseMethod(method){
  signupMethod = method;
  document.getElementById('signup-methods').classList.add('hidden');
  document.getElementById('profile-form').classList.remove('hidden');

  if(method === 'google'){
    supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/home.html' }});
  }
  if(method === 'email'){
    document.getElementById('email').classList.remove('hidden');
    document.getElementById('password').classList.remove('hidden');
  }
}

// Email signup
document.getElementById('signup-btn').onclick = async function(){
  messageBox.style.display = 'none';
  const username = document.getElementById("username").value.trim();
  const display_name = document.getElementById("display_name").value.trim();
  const bio = document.getElementById("bio").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const avatarFile = avatarInput.files[0];

  if(!username || !display_name || !email || !password){
    return showMessage("Please fill all required fields", 'error');
  }

  // Sign up via email
  const { data: userData, error } = await supabase.auth.signUp({
    email,
    password,
    options: { data: { username, display_name, bio } }
  });
  if(error) return showMessage(error.message, 'error');

  const userId = userData.user.id;

  // Upload avatar
  let avatar_url = "";
  if(avatarFile){
    const { data: avatarData, error: avatarError } = await supabase.storage
      .from('avatars')
      .upload('public/' + userId + '-' + avatarFile.name, avatarFile, { upsert:true });
    if(!avatarError) avatar_url = SUPABASE_URL + "/storage/v1/object/public/avatars/" + avatarData.path;
  }

  // Insert into users table
  const { error: profileError } = await supabase
    .from('users')
    .insert([{ id: userId, username, display_name, bio, avatar_url }]);
  if(profileError) return showMessage(profileError.message, 'error');

  showMessage("Signup successful! Redirecting...", 'success');
  setTimeout(()=>window.location.href="home.html", 1500);
}
</script>
</body>
</html>
