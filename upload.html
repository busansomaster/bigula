<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Video - BIGULA</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .upload-box { background-color: #1f1f1f; padding: 30px; border-radius: 10px; width: 350px; text-align: center; }
    input[type="file"] { margin: 20px 0; }
    input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    button { background-color: #ff4d4f; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
    a { color: #ff4d4f; display: block; margin-top: 10px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="upload-box">
    <h2>Upload Video</h2>
    <input type="file" accept="video/*">
    <input type="text" placeholder="Video Title">
    <button onclick="alert('Upload functionality coming soon!')">Upload</button>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
