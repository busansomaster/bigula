<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload - BIGULA</title>
<style>
body {
  margin:0; padding:0; font-family:Arial,sans-serif;
  display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden;
  background: linear-gradient(270deg, #ff0050, #1a1a1a, #ff4d4f, #000);
  background-size: 800% 800%; animation: gradientMove 15s ease infinite; color:#fff;
}
@keyframes gradientMove { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
.particle { position: absolute; border-radius: 50%; opacity: 0.7; animation: float 10s linear infinite; }
@keyframes float { 0% { transform: translateY(100vh) scale(0.5); opacity:0.2; } 50% { opacity:0.6; } 100% { transform: translateY(-10vh) scale(1); opacity:0; } }

.container { background: rgba(17,17,17,0.9); padding:30px; border-radius:12px; width:400px; z-index:10; position: relative; }
section { display:none; flex-direction:column; }
section.active { display:flex; }
h1 { color:#ff0050; text-align:center; }
button { padding:12px; margin-top:10px; border:none; border-radius:8px; font-weight:bold; background:#ff0050; color:#fff; cursor:pointer; }
button.disabled { background:#555; cursor:not-allowed; }
input, select, textarea { width:100%; padding:10px; margin-top:10px; border-radius:8px; border:none; background:#1f1f1f; color:#fff; }
video { width:100%; border-radius:12px; margin-top:10px; }
.filters { display:flex; gap:5px; margin-top:10px; justify-content:center; flex-wrap:wrap; }
.filters button { padding:5px 10px; border-radius:5px; border:none; cursor:pointer; font-size:12px; }
.trim-controls { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
.trim-controls input { width:45%; }
.progress-bar { width:100%; background:#222; height:12px; border-radius:6px; margin-top:10px; }
.progress-fill { height:100%; width:0; background:#ff0050; border-radius:6px; transition: width 0.3s; }
.message { margin-top:8px; font-size:14px; color:#ff9999; text-align:center; display:none; }
</style>
</head>
<body>

<div id="particles"></div>

<div class="container">
<h1>Upload Video</h1>

<!-- Step 1: Select -->
<section id="step1" class="active">
  <button id="goLiveBtn">Go Live</button>
  <button id="cameraBtn">🎥 Record from Camera</button>
  <button id="fileBtn">📁 Select Video File</button>
  <video id="preview" controls></video>
  <button id="toStep2" class="disabled" disabled>Next: Edit Video</button>
  <div id="msgStep1" class="message"></div>
</section>

<!-- Step 2: Editor / Filters -->
<section id="step2">
  <video id="filterPreview" controls></video>

  <!-- Trim controls -->
  <div class="trim-controls">
    <label>Start <input type="number" id="trimStart" min="0" step="0.1" value="0"></label>
    <label>End <input type="number" id="trimEnd" min="0" step="0.1" value="0"></label>
  </div>
  <button id="applyTrim">Apply Trim</button>

  <!-- Filters -->
  <div class="filters">
    <button data-filter="">Normal</button>
    <button data-filter="grayscale(50%)">B&W</button>
    <button data-filter="sepia(60%)">Sepia</button>
    <button data-filter="brightness(1.3)">Bright</button>
    <button data-filter="contrast(1.3)">Contrast</button>
  </div>

  <button id="toStep3">Next: Add Details</button>
  <div id="msgStep2" class="message"></div>
</section>

<!-- Step 3: Metadata -->
<section id="step3">
  <input type="text" id="title" placeholder="Title" required>
  <select id="category" required>
    <option value="">Select Category</option>
    <option value="music">Music</option>
    <option value="dance">Dance</option>
    <option value="animals">Animals</option>
    <option value="film and animation">Film & Animation</option>
    <option value="people and blogs">People & Blogs</option>
    <option value="autos and vehicles">Autos & Vehicles</option>
    <option value="sports">Sports</option>
    <option value="comedy">Comedy</option>
    <option value="entertainment">Entertainment</option>
    <option value="news and politics">News & Politics</option>
    <option value="fashion and style">Fashion & Style</option>
    <option value="education">Education</option>
    <option value="science and technology">Science & Technology</option>
  </select>
  <textarea id="description" placeholder="Description" required></textarea>
  <button id="uploadBtn">Upload Video</button>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div id="msgStep3" class="message"></div>
</section>

<script type="module">
// Floating particles
const particlesEl = document.getElementById("particles");
for(let i=0;i<30;i++){
  const p = document.createElement("div");
  p.className="particle";
  p.style.width = p.style.height = Math.random()*15+5+"px";
  p.style.left = Math.random()*100+"vw";
  p.style.background = ["#ff0050","#ff4d4f","#ff99aa"][Math.floor(Math.random()*3)];
  p.style.animationDuration = 8+Math.random()*7+"s";
  p.style.animationDelay = Math.random()*5+"s";
  particlesEl.appendChild(p);
}

// Supabase setup
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const SUPABASE_URL = 'https://uyuofjiiptnbbcuntbfi.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dW9mamlpcHRuYmJjdW50YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMzQ3MjcsImV4cCI6MjA4NzkxMDcyN30.-FBKM7NKTSm20qzkExueYhqrE6oaK6a6de1qCsl2nuQ'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// Mock user
let currentUser = { uid: "123", followers: 400, email: "demo@bigula.com" }

// Elements
const preview = document.getElementById("preview")
const filterPreview = document.getElementById("filterPreview")
const goLiveBtn = document.getElementById("goLiveBtn")
const toStep2 = document.getElementById("toStep2")
const step1 = document.getElementById("step1")
const step2 = document.getElementById("step2")
const step3 = document.getElementById("step3")
const trimStart = document.getElementById("trimStart")
const trimEnd = document.getElementById("trimEnd")
const applyTrim = document.getElementById("applyTrim")
const msgStep1 = document.getElementById("msgStep1")
const msgStep2 = document.getElementById("msgStep2")
const msgStep3 = document.getElementById("msgStep3")

// Disable Go Live if followers < 500
if(currentUser.followers < 500) goLiveBtn.classList.add("disabled")
goLiveBtn.onclick = () => {
  if(currentUser.followers < 500) {
    msgStep1.style.display="block"; msgStep1.textContent="Need 500+ followers to Go Live"
    return
  }
  window.location.href = "live.html"
}

// Step 1: Select file
document.getElementById("fileBtn").onclick = () => {
  const input = document.createElement("input")
  input.type = "file"
  input.accept = "video/*"
  input.onchange = () => {
    const file = input.files[0]
    preview.src = URL.createObjectURL(file)
    preview.play()
    toStep2.disabled = false
    toStep2.classList.remove("disabled")
    preview.dataset.fileObj = file
    msgStep1.style.display="none"
  }
  input.click()
}

// Step 2: Editor
toStep2.onclick = () => {
  if(!preview.dataset.fileObj){
    msgStep1.style.display="block"; msgStep1.textContent="Select a video first"
    return
  }
  step1.classList.remove("active")
  step2.classList.add("active")
  filterPreview.src = preview.src
  filterPreview.onloadedmetadata = () => { trimEnd.value = filterPreview.duration }
}

// Filters
document.querySelectorAll(".filters button").forEach(btn => {
  btn.onclick = () => { filterPreview.style.filter = btn.dataset.filter }
})

// Trim
applyTrim.onclick = () => {
  const start = parseFloat(trimStart.value)
  const end = parseFloat(trimEnd.value)
  if(isNaN(start)||isNaN(end)||start>=end||end>filterPreview.duration){
    msgStep2.style.display="block"; msgStep2.textContent="Invalid trim range"; return
  }
  filterPreview.currentTime = start
  filterPreview.ontimeupdate = () => { if(filterPreview.currentTime >= end) filterPreview.pause() }
  msgStep2.style.display="block"; msgStep2.textContent=`Trim set: ${start.toFixed(1)}s - ${end.toFixed(1)}s`
}

// Step 3: Metadata
document.getElementById("toStep3").onclick = () => {
  step2.classList.remove("active")
  step3.classList.add("active")
}

// Upload
document.getElementById("uploadBtn").onclick = async () => {
  const file = preview.dataset.fileObj
  if(!file){ msgStep3.style.display="block"; msgStep3.textContent="Select a video first"; return }
  const title = document.getElementById("title").value
  const category = document.getElementById("category").value
  const description = document.getElementById("description").value
  if(!title || !category || !description){ msgStep3.style.display="block"; msgStep3.textContent="Fill all fields"; return }

  const fileName = `${Date.now()}_${file.name}`
  const { data, error } = await supabase.storage.from('videos').upload(fileName, file)
  if(error){ msgStep3.style.display="block"; msgStep3.textContent="Upload failed: "+error.message; return }

  const { publicURL } = supabase.storage.from('videos').getPublicUrl(fileName)
  msgStep3.style.display="block"; msgStep3.textContent="Upload complete!"
}
</script>
</body>
</html>
